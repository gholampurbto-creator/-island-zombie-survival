name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Island-Zombie-Survival-Android-Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download project source ZIP
        run: |
          curl -fL --retry 3 -o source.zip "https://raw.githubusercontent.com/gholampurbto-creator/-island-zombie-survival/main/Island-Zombie-Survival-Android-Source.zip"
          unzip -q source.zip -d source

      - name: Verify project
        run: test -f source/zombie_apk_work/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/zombie_apk_work/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        working-directory: source/zombie_apk_work
        run: npm install

      - name: Build web app
        working-directory: source/zombie_apk_work
        run: npm run build

      - name: Add Capacitor Android platform
        working-directory: source/zombie_apk_work
        run: |
          npm install @capacitor/android@^7.4.3
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: source/zombie_apk_work/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Island-Zombie-Survival-APK
          path: source/zombie_apk_work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
